<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>
  
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16213e;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Neural network nodes with varying opacity -->
  <g fill="#00ffff">
    <!-- High opacity nodes -->
    <circle cx="150" cy="200" r="8" opacity="0.8"/>
    <circle cx="300" cy="150" r="12" opacity="0.9"/>
    <circle cx="450" cy="250" r="6" opacity="0.7"/>
    <circle cx="600" cy="180" r="10" opacity="0.85"/>
    <circle cx="750" cy="220" r="7" opacity="0.75"/>
    <circle cx="900" cy="160" r="9" opacity="0.8"/>
    <circle cx="1050" cy="240" r="11" opacity="0.9"/>
    
    <!-- Medium opacity nodes -->
    <circle cx="200" cy="350" r="7" opacity="0.5"/>
    <circle cx="350" cy="400" r="9" opacity="0.6"/>
    <circle cx="500" cy="380" r="5" opacity="0.4"/>
    <circle cx="650" cy="420" r="8" opacity="0.55"/>
    <circle cx="800" cy="360" r="6" opacity="0.45"/>
    <circle cx="950" cy="390" r="10" opacity="0.65"/>
    
    <!-- Low opacity/fading nodes -->
    <circle cx="100" cy="450" r="6" opacity="0.2"/>
    <circle cx="250" cy="500" r="8" opacity="0.15"/>
    <circle cx="400" cy="480" r="4" opacity="0.25"/>
    <circle cx="550" cy="520" r="7" opacity="0.18"/>
    <circle cx="700" cy="460" r="5" opacity="0.22"/>
    <circle cx="850" cy="490" r="9" opacity="0.16"/>
    <circle cx="1000" cy="510" r="6" opacity="0.2"/>
    <circle cx="1100" cy="470" r="8" opacity="0.19"/>
  </g>
  
  <!-- Connections between nodes -->
  <g stroke="#00ffff" stroke-width="1" fill="none" opacity="0.3">
    <line x1="150" y1="200" x2="300" y2="150"/>
    <line x1="300" y1="150" x2="450" y2="250"/>
    <line x1="450" y1="250" x2="600" y2="180"/>
    <line x1="600" y1="180" x2="750" y2="220"/>
    <line x1="750" y1="220" x2="900" y2="160"/>
    <line x1="900" y1="160" x2="1050" y2="240"/>
    
    <line x1="200" y1="350" x2="350" y2="400"/>
    <line x1="350" y1="400" x2="500" y2="380"/>
    <line x1="500" y1="380" x2="650" y2="420"/>
    <line x1="650" y1="420" x2="800" y2="360"/>
    <line x1="800" y1="360" x2="950" y2="390"/>
  </g>
  
  <!-- Title text -->
  <text x="600" y="280" font-family="Arial, sans-serif" font-size="64" font-weight="bold" text-anchor="middle" fill="white">
    OBSERVABILITY CRISIS
  </text>
  
  <!-- Subtitle text -->
  <text x="600" y="340" font-family="Arial, sans-serif" font-size="32" text-anchor="middle" fill="#00ffff" opacity="0.8">
    AI Agents Operating in the Dark
  </text>
</svg>