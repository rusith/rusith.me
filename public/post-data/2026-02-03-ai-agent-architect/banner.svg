<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a2a2a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Flowing data streams -->
  <path d="M 100 315 Q 300 200 500 315 T 900 315" stroke="#4a90e2" stroke-width="3" fill="none" opacity="0.7"/>
  <path d="M 100 315 Q 300 430 500 315 T 900 315" stroke="#7b68ee" stroke-width="3" fill="none" opacity="0.7"/>
  
  <!-- Processing nodes -->
  <circle cx="200" cy="315" r="25" fill="#4a90e2" opacity="0.8"/>
  <circle cx="400" cy="315" r="30" fill="#7b68ee" opacity="0.8"/>
  <circle cx="600" cy="315" r="35" fill="#90ee90" opacity="0.8"/>
  <circle cx="800" cy="315" r="30" fill="#4a90e2" opacity="0.8"/>
  <circle cx="1000" cy="315" r="25" fill="#7b68ee" opacity="0.8"/>
  
  <!-- Connections -->
  <line x1="225" y1="315" x2="375" y2="315" stroke="#90ee90" stroke-width="2" opacity="0.6"/>
  <line x1="430" y1="315" x2="570" y2="315" stroke="#4a90e2" stroke-width="2" opacity="0.6"/>
  <line x1="635" y1="315" x2="765" y2="315" stroke="#7b68ee" stroke-width="2" opacity="0.6"/>
  <line x1="830" y1="315" x2="975" y2="315" stroke="#90ee90" stroke-width="2" opacity="0.6"/>
  
  <!-- Feedback loops -->
  <path d="M 150 250 Q 150 150 250 150 Q 350 150 350 250" stroke="#4a90e2" stroke-width="2" fill="none" opacity="0.4" stroke-dasharray="5,5"/>
  <path d="M 850 380 Q 950 380 950 480 Q 1050 480 1050 380" stroke="#7b68ee" stroke-width="2" fill="none" opacity="0.4" stroke-dasharray="5,5"/>
</svg>