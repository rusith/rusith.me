<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="node" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e94560;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Network nodes -->
  <circle cx="200" cy="200" r="30" fill="url(#node)" opacity="0.8"/>
  <circle cx="600" cy="150" r="40" fill="url(#node)" opacity="0.9"/>
  <circle cx="1000" cy="200" r="35" fill="url(#node)" opacity="0.8"/>
  <circle cx="400" cy="400" r="25" fill="url(#node)" opacity="0.7"/>
  <circle cx="800" cy="450" r="30" fill="url(#node)" opacity="0.8"/>
  
  <!-- Connections -->
  <line x1="200" y1="200" x2="600" y2="150" stroke="#0f3460" stroke-width="3" opacity="0.6"/>
  <line x1="600" y1="150" x2="1000" y2="200" stroke="#0f3460" stroke-width="3" opacity="0.6"/>
  <line x1="200" y1="200" x2="400" y2="400" stroke="#0f3460" stroke-width="2" opacity="0.5"/>
  <line x1="600" y1="150" x2="800" y2="450" stroke="#0f3460" stroke-width="2" opacity="0.5"/>
  <line x1="400" y1="400" x2="800" y2="450" stroke="#0f3460" stroke-width="2" opacity="0.5"/>
  
  <!-- Title -->
  <text x="600" y="320" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="#ffffff">AI Agent Architect</text>
  <text x="600" y="370" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#e94560">Beyond the Prompt</text>
  
  <!-- Decorative elements -->
  <rect x="100" y="100" width="1000" height="430" fill="none" stroke="#e94560" stroke-width="2" opacity="0.3"/>
</svg>